name: Runtime Checksum Diagnosis

on:
  push:
    branches: [runtime-checksum-diagnosis]
    paths:
      - '.github/workflows/runtime-checksum-diagnosis.yml'
      - 'telegram-options-ai-v6/**'
  workflow_dispatch:

jobs:
  checksum:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Verify runtime checksum gate
        working-directory: telegram-options-ai-v6
        shell: bash
        run: |
          sha256sum --check runtime.sha256
          echo "CHECKSUM_EXIT=0"
      - name: Build production Docker image
        run: docker build --progress=plain -t fahad-options-ai-v6-check ./telegram-options-ai-v6
