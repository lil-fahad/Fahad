name: Local Heavy Lab CI

on:
  push:
    branches: [local-heavy-trading-lab]
  workflow_dispatch:

jobs:
  unit:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: local-heavy-trading-lab
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install package
        run: python -m pip install -e '.[dev,data,eval]'
      - name: Run tests
        run: python -m pytest -q
      - name: Hardware doctor smoke
        run: lab doctor --json
      - name: Downloader CLI smoke
        run: lab download-models --help
      - name: Torch resolver dry run
        run: python scripts/install_torch.py --dry-run
      - name: Validate Windows PowerShell scripts
        shell: pwsh
        run: |
          $scripts = @(
            "scripts/install_windows.ps1",
            "scripts/start_training_windows.ps1"
          )
          foreach ($script in $scripts) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $script).Path,
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error "$script: $($_.Message)" }
              exit 1
            }
          }
      - name: Verify no live broker surface in package
        run: |
          if grep -RniE 'alpaca|interactive.?brokers|tradier|broker_api_key|order_endpoint|live_trading' src/heavy_lab; then
            echo 'Forbidden live broker surface found in training package.'
            exit 1
          fi
