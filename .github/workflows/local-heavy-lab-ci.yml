name: Local Heavy Lab CI

on:
  push:
    branches: [local-heavy-trading-lab]
  workflow_dispatch:

jobs:
  unit:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: local-heavy-trading-lab
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install package
        run: python -m pip install -e '.[dev]'
      - name: Run tests
        run: python -m pytest -q
