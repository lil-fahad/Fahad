name: V6 Shadow Model Tests

on:
  push:
    branches: [railway-options-ai-v6-shadow-models]
    paths:
      - 'telegram-options-ai-v6/telegram_bridge/**'
      - 'telegram-options-ai-v6/tests/**'
      - '.github/workflows/v6-shadow-model-tests.yml'
  workflow_dispatch:

jobs:
  shadow-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest httpx==0.28.1 tzdata==2025.2 mcp==1.29.1
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.7.1
      - name: Run full v6 test suite
        working-directory: telegram-options-ai-v6
        run: python -m pytest -q
